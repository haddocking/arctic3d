[project]
name = "arctic3d"
license = "Apache-2.0"
version = "0.7.1"
requires-python = ">=3.10"
description = "Automatic Retrieval and ClusTering of Interfaces in Complexes from 3D structural information"
authors = [{ name = "Marco Giulini" }]
maintainers = [{ name = "BonvinLab", email = "bonvinlab.support@uu.nl" }]
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
]

dependencies = [
  "bio>=1.6.2",
  "lxml>=5.4.0",
  "mdanalysis>=2.7.0",
  "requests>=2.32.4",
  "biopython>=1.85",
  "scipy>=1.13.1",
  "matplotlib>=3.9.4",
  "pdb-tools>=2.5.0",
  "pandas>=2.2.3",
  "openpyxl>=3.1.5",
  "plotly>=6.0.1",
  "pdbecif>=1.5",
  "jsonpickle>=4.1.0",
  "molviewspec>=1.8.1",
]

[project.scripts]
arctic3d = "arctic3d.cli:maincli"
arctic3d-resclust = "arctic3d.cli_resclust:maincli"
arctic3d-localise = "arctic3d.cli_localise:maincli"
arctic3d-restraints = "arctic3d.cli_restraints:maincli"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "coverage",
  "hypothesis",
  "mypy",
  "ruff",
  "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = "src"
markers = [
  "sanity: tests if the apis are working as expected",
  "integration: tests the integration of different components",
]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
