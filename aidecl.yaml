# See https://ai-declaration.org/ for more information.
schema_version: 1.0.0
project:
  name: ARCTIC-3D
  repository: https://github.com/haddocking/arctic3d.git
  content_type: software
  license: Apache-2.0
ai_usage:
  used: true
  summary: >-
    Claude Code was used since July 2026 for bug fixes, the HTML report and
    the other changes of v0.7.0, linting and the documentation, always
    reviewed by a human; GitHub Copilot reviewed pull requests. The code
    up to v0.6 was written without AI tools.
  level: significant
  scope:
    code_completion: false
    code_review: true
    code_generation: true
    documentation: true
    refactoring: true
  tools:
    - name: Claude Code
      type: agent
      hosting: cloud_vendor
      purpose:
        - agent in the terminal
        - fixing, extending, testing and documenting the code
    - name: GitHub Copilot
      type: agent
      hosting: cloud_vendor
      purpose:
        - code review on GitHub
declaration:
  date: '2026-11-13'
  declared_by: amjjbonvin
